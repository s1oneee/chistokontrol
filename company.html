<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЧистоКонтроль · Страница компании</title>

<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
button{font-family:inherit}
</style>

<style>
html,body{margin:0;height:100%;background:#DDE3E0}
.pt-bar{height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:#17201C;color:#FFFFFF;font:500 14px 'Golos Text',system-ui,sans-serif}
.pt-bar a{color:#9FE3D6;text-decoration:none;font-weight:600}
.pt-bar span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{display:flex;justify-content:center}
#app>div{width:min(100vw,430px)!important;height:calc(100dvh - 40px)!important}
@media (min-width:600px){
  #app{padding:24px 0}
  #app>div{width:390px!important;height:min(844px,calc(100dvh - 88px))!important;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
}
</style>
</head>
<body>
<div class="pt-bar"><a href="index.html">‹ Все экраны</a><span>Страница компании · демо</span></div>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F4; color: #17201C; font-family: 'Golos Text', system-ui, sans-serif; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">

    <div style="background: #FFFFFF; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E1E6E3">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 16px; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">ВК</div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 22px; font-weight: 700">Ваш клининг</span>
          <span style="font-size: 14px; color: #4F5B56">Уборка квартир и домов · Тюмень</span>
        </div>
      </div>
    </div>

    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">

      <div style="font-size: 18px; font-weight: 700">Как мы работаем</div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
        <sc-for list="{{how}}" as="h" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EDF0EE">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; background: #DDF0EC; color: #0F5F58; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{h.n}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{h.title}}</span><span style="font-size: 14px; color: #3F4A45; line-height: 1.4">{{h.text}}</span></span>
          </div>
        </sc-for>
      </div>

      <div style="font-size: 18px; font-weight: 700; margin-top: 4px">Услуги и цены</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3E8E5; border-radius: 12px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
          <span style="font-size: 22px; font-weight: 700">{{typeRate}} ₽/м²</span>
          <span style="font-size: 14px; color: #4F5B56">{{typeExample}}</span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #4F5B56">Входит</span>
        <sc-for list="{{typeIn}}" as="ti" hint-placeholder-count="4">
          <div style="display: flex; gap: 8px; font-size: 14px; line-height: 1.4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg><span>{{ti.label}}</span></div>
        </sc-for>
        <span style="font-size: 13px; font-weight: 600; color: #4F5B56; margin-top: 4px">Не входит</span>
        <sc-for list="{{typeNo}}" as="tn" hint-placeholder-count="1">
          <div style="display: flex; gap: 8px; font-size: 14px; line-height: 1.4; color: #4F5B56"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7570" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg><span>{{tn.label}}</span></div>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
        <sc-for list="{{extras}}" as="ex" hint-placeholder-count="6">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid #EDF0EE; font-size: 15px">
            <span>{{ex.label}}</span><span style="font-weight: 600; white-space: nowrap">{{ex.price}}</span>
          </div>
        </sc-for>
        <div style="padding: 10px 0 12px; font-size: 13px; color: #4F5B56; line-height: 1.4">Точную сумму вы увидите в расчёте до уборки. На месте она меняется только с вашего согласия.</div>
      </div>

      <div style="padding: 8px 0 4px; font-size: 12px; color: #4F5B56; text-align: center">Страница работает на ЧистоКонтроль</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E1E6E3; display: flex; gap: 8px">
    <a href="tel:+79000000000" aria-label="Позвонить в компанию" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; border: 1px solid #D5DDD9; display: flex; align-items: center; justify-content: center; color: #0F766E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
    <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Рассчитать стоимость</a>
  </div>

</div>
</template>
<script>window.__PAGE_MAP__ = {"Main":"client.html","Worker":"worker.html","Owner":"owner.html","Company":"company.html"};</script>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'gen' };
  }
  renderVals() {
    const s = this.state;
    const set = (p) => this.setState(p);
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const TYPES = {
      gen: { label: 'Генеральная', rate: 170,
        in: ['Пыль везде: верх шкафов, плинтусы, батареи', 'Двери, ручки, выключатели, розетки', 'Кухонный фартук и фасады', 'Санузел: плитка, швы, налёт', 'Полы под лёгкой мебелью'],
        no: ['За тяжёлой мебелью'] },
      sup: { label: 'Поддерживающая', rate: 100,
        in: ['Пыль с открытых поверхностей', 'Кухня и санузел сверху', 'Полы в открытых местах', 'Вынос мусора'],
        no: ['Шкафы внутри'] },
      rem: { label: 'После ремонта', rate: 200,
        in: ['Строительная пыль в несколько проходов', 'Следы краски, клея, скотча', 'Цементный налёт на сантехнике'],
        no: ['Вывоз строительного мусора'] }
    };
    const t = TYPES[s.type];
    const seg = (on) => 'min-height: 40px; padding: 0 2px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #17201C; box-shadow: 0 1px 2px rgba(0,0,0,0.08)' : 'background: transparent; color: #3F4A45');
    return {
      how: [
        { n: '1', title: 'Расчёт до уборки', text: 'Вы описываете квартиру и сразу видите цену и что в неё входит.' },
        { n: '2', title: 'Фото до и после', text: 'Исполнитель снимает каждую зону — отчёт приходит вам в тот же день.' },
        { n: '3', title: 'Цена — только с вашего согласия', text: 'Если на месте объём другой, вы видите фото и подтверждаете новую сумму.' }
      ],
      types: Object.keys(TYPES).map((k) => ({ label: TYPES[k].label, on: s.type === k, style: seg(s.type === k), pick: () => set({ type: k }) })),
      typeRate: t.rate, typeExample: 'квартира 55 м² — ' + fmt(55 * t.rate) + ' ₽',
      typeIn: t.in.map((label) => ({ label })), typeNo: t.no.map((label) => ({ label })),
      extras: [
        { label: 'Окно стандартное', price: '600 ₽ / шт.' }, { label: 'Окно панорамное', price: '1 500 ₽ / шт.' },
        { label: 'Духовка или холодильник', price: '900 ₽' }, { label: 'Балкон', price: '1 500 ₽' },
        { label: 'Выезд за город', price: '1 000 ₽' }, { label: 'Минимальный заказ', price: '3 000 ₽' }
      ]
    };
  }
}

mountPrototype(Component, 'tpl', 'app');
</script>
</body>
</html>
