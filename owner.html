<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЧистоКонтроль · Владелец</title>

<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
button{font-family:inherit}
</style>

<style>
html,body{margin:0;height:100%;background:#DDE3E0}
.pt-bar{height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:#17201C;color:#FFFFFF;font:500 14px 'Golos Text',system-ui,sans-serif}
.pt-bar a{color:#9FE3D6;text-decoration:none;font-weight:600}
.pt-bar span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{display:flex;justify-content:center}
#app>div{width:min(100vw,430px)!important;height:calc(100dvh - 40px)!important}
@media (min-width:600px){
  #app{padding:24px 0}
  #app>div{width:390px!important;height:min(844px,calc(100dvh - 88px))!important;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
}
</style>
</head>
<body>
<div class="pt-bar"><a href="index.html">‹ Все экраны</a><span>Владелец · демо</span></div>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F4; color: #17201C; font-family: 'Golos Text', system-ui, sans-serif; overflow: hidden">

  <div style="flex-shrink: 0; padding: 12px 16px 10px; background: #FFFFFF; border-bottom: 1px solid #E1E6E3; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">ЧистоКонтроль</span><span style="font-size: 13px; color: #4F5B56">Сергей · руководитель и исполнитель</span></div>
      <button onClick="{{openSettings}}" aria-label="Настройки" aria-pressed="{{inSettings}}" style="{{gearStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>
    <sc-if value="{{notSettings}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3E8E5; border-radius: 12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{inSettings}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 48px">
        <button onClick="{{settingsBack}}" style="height: 44px; padding: 0 12px 0 4px; border: 0; border-radius: 10px; background: transparent; color: #0F766E; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap">‹ {{backLabel}}</button>
        <span style="font-size: 17px; font-weight: 700; min-width: 0">{{settingsTitle}}</span>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{isToday}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 14px; color: #4F5B56">Суббота, 19 октября · 12:50</div>

      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; font-weight: 700">Требует внимания</span><span style="font-size: 14px; font-weight: 600; color: #8A3A0B">{{attentionCount}}</span></div>

      <sc-if value="{{dmgOpen}}" hint-placeholder-val="{{true}}">
        <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid #E3B999">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #6E2E08"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17.5v.01"></path></svg>Повреждение · 10:58</span>
            <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #FDEBDD; color: #8A3A0B">{{dmgStatusLabel}}</span>
          </div>
          <div style="font-size: 15px; font-weight: 600">Ольга · ул. Республики, 92 · клиентка Марина</div>
          <div style="font-size: 14px; line-height: 1.4; color: #3F4A45">Повредили при уборке · «Треснул плафон люстры в комнате, когда протирала».</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <div style="height: 64px; border-radius: 10px; background: #E4E0D7; color: #4A443A; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; padding: 4px">Фото «до» · 10:05</div>
            <div style="height: 64px; border-radius: 10px; background: #F2D9C4; color: #6E2E08; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; padding: 4px">Общий план</div>
            <div style="height: 64px; border-radius: 10px; background: #F2D9C4; color: #6E2E08; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; padding: 4px">Крупно</div>
          </div>
          <sc-if value="{{dmgNew}}" hint-placeholder-val="{{true}}">
            <div style="font-size: 13px; color: #4F5B56">Клиентка пока не знает — лучше позвонить первым.</div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button onClick="{{dmgContact}}" style="height: 48px; border: 0; border-radius: 12px; background: #8A3A0B; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Позвонить клиентке</button>
              <button onClick="{{dmgContact}}" style="height: 48px; border-radius: 12px; border: 1px solid #D5DDD9; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer">Написать в заказ</button>
            </div>
          </sc-if>
          <sc-if value="{{dmgContacted}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 14px; font-weight: 600">Чем закончился разговор?</span>
            <sc-for list="{{dmgOutcomes}}" as="oc" hint-placeholder-count="3">
              <button onClick="{{oc.pick}}" style="min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid #D5DDD9; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer">{{oc.label}}</button>
            </sc-for>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{reqWaiting}}" hint-placeholder-val="{{true}}">
        <button onClick="{{toRequests}}" style="width: 100%; text-align: left; background: #FFFFFF; border-radius: 16px; padding: 14px 16px; border: 1.5px solid #E3B999; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #17201C">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{reqWaitingTitle}}</span><span style="font-size: 13px; color: #4F5B56">Отправьте расчёт, пока клиент не ушёл к другим</span></span>
          <span style="font-size: 14px; font-weight: 600; color: #0F766E; white-space: nowrap">Открыть →</span>
        </button>
      </sc-if>

      <sc-if value="{{allClear}}" hint-placeholder-val="{{false}}">
        <div style="padding: 14px 16px; border-radius: 16px; background: #DDF0EC; color: #0F4F49; font-size: 15px; font-weight: 600">Всё под контролем — срочного ничего нет.</div>
      </sc-if>
      <sc-if value="{{dmgResolved}}" hint-placeholder-val="{{false}}">
        <div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; color: #0F4F49; font-size: 14px; line-height: 1.4; border: 1px solid #9FCFC4">✓ Повреждение на Республики: {{dmgOutcomeText}} Запись с фото сохранена в заказе.</div>
      </sc-if>

      <div style="font-size: 18px; font-weight: 700; margin-top: 8px">Идёт по плану</div>
      <div style="flex-shrink: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div style="border-bottom: 1px solid #EDF0EE">
            <button onClick="{{r.toggle}}" aria-expanded="{{r.open}}" style="width: 100%; min-height: 64px; padding: 12px 16px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; color: #17201C">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #E3E8E5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{r.initials}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
                <span style="{{r.subStyle}}">{{r.sub}}</span>
              </span>
              <span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{r.sum}}</span>
              <span style="color: #4F5B56">{{r.arrow}}</span>
            </button>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
              <div style="padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{r.details}}" as="d" hint-placeholder-count="2">
                  <div style="{{d.style}}"><span style="font-weight: 700">{{d.label}}</span><span>{{d.text}}</span></div>
                </sc-for>
                <sc-for list="{{r.thread}}" as="m" hint-placeholder-count="0">
                  <div style="{{m.style}}"><span style="font-size: 12px; font-weight: 600; color: #4F5B56">{{m.who}} · {{m.time}}</span><span style="font-size: 14px; line-height: 1.4">{{m.text}}</span></div>
                </sc-for>
                <sc-if value="{{r.isMine}}" hint-placeholder-val="{{false}}">
                  <a href="Worker.dc.html" style="height: 44px; border-radius: 12px; background: #0F766E; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Открыть как исполнитель</a>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px"><span style="font-size: 18px; font-weight: 700">Наличные у исполнителей</span><span style="font-size: 15px; font-weight: 700">{{cashTotal}}</span></div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
        <sc-for list="{{cashRows}}" as="cr" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 64px; border-bottom: 1px solid #EDF0EE">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{cr.name}} · {{cr.sumText}} ₽</span><span style="{{cr.subStyle}}">{{cr.sub}}</span></span>
            <sc-if value="{{cr.open}}" hint-placeholder-val="{{true}}">
              <button onClick="{{cr.settle}}" style="height: 40px; padding: 0 12px; flex-shrink: 0; border-radius: 10px; border: 1px solid #D5DDD9; background: #FFFFFF; color: #0F766E; font-size: 14px; font-weight: 600; cursor: pointer">Сдал(а)</button>
            </sc-if>
          </div>
        </sc-for>
        <div style="padding: 10px 0 12px; font-size: 13px; color: #4F5B56; line-height: 1.4">Оплаты по СБП сюда не попадают — они сразу на счёте компании.</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isRequests}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 14px; color: #4F5B56">Новые заявки с вашей ссылки на Авито и в мессенджерах</div>
      <sc-for list="{{requests}}" as="r" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">{{r.client}}</span><span style="font-size: 13px; color: #4F5B56">{{r.when}}</span></div>
          <div style="font-size: 17px; font-weight: 600; line-height: 1.3">{{r.addr}}</div>
          <div style="font-size: 14px; color: #3F4A45; line-height: 1.4">{{r.scope}}</div>
          <div style="display: flex; gap: 6px; align-items: center">
            <sc-for list="{{r.photos}}" as="p" hint-placeholder-count="2">
              <button onClick="{{p.open}}" aria-pressed="{{p.on}}" aria-label="Открыть фото" style="{{p.style}}">{{p.label}}</button>
            </sc-for>
            <span style="font-size: 12px; color: #4F5B56">нажмите, чтобы увеличить</span>
          </div>
          <sc-if value="{{r.hasPreview}}" hint-placeholder-val="{{false}}">
            <div style="height: 200px; border-radius: 12px; background: #E4E0D7; color: #4A443A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 12px; box-sizing: border-box">
              <span style="font-size: 16px; font-weight: 600">{{r.previewTitle}}</span>
              <span style="font-size: 13px; line-height: 1.4">{{r.previewNote}}</span>
            </div>
          </sc-if>
          <div style="padding: 10px 12px; border-radius: 12px; background: #F3F5F4; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 600; color: #4F5B56">Комментарий клиента · доступ: {{r.access}}</span>
            <span style="font-size: 14px; line-height: 1.4">{{r.comment}}</span>
          </div>
          <sc-if value="{{r.hasSuggest}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; font-weight: 600; color: #4F5B56">Просьбы из комментария — добавить в расчёт?</span>
              <sc-for list="{{r.suggestions}}" as="sg" hint-placeholder-count="2">
                <button onClick="{{sg.toggle}}" aria-pressed="{{sg.on}}" style="{{sg.style}}"><span>{{sg.text}}</span><span style="white-space: nowrap">{{sg.priceText}}</span></button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{r.hasWin}}" hint-placeholder-val="{{false}}">
            <div style="{{r.winBoxStyle}}">
              <span style="font-size: 14px; font-weight: 700">{{r.winTitle}}</span>
              <span style="font-size: 14px; line-height: 1.4">{{r.winText}}</span>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{r.winOpts}}" as="wo" hint-placeholder-count="2">
                  <button onClick="{{wo.pick}}" aria-pressed="{{wo.on}}" style="{{wo.style}}">{{wo.label}}</button>
                </sc-for>
              </div>
              <span style="font-size: 14px; font-weight: 600">{{r.winLine}}</span>
            </div>
          </sc-if>
          <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 4px; border-top: 1px solid #EDF0EE"><span style="font-size: 14px; color: #4F5B56">Расчёт по прайсу</span><span style="font-size: 20px; font-weight: 700">{{r.totalText}} ₽</span></div>
          <div style="font-size: 13px; font-weight: 600; color: #4F5B56">Исполнитель · {{r.dayName}}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{r.people}}" as="pp" hint-placeholder-count="4">
              <button onClick="{{pp.pick}}" aria-pressed="{{pp.on}}" style="{{pp.style}}"><span style="font-size: 14px; font-weight: 600">{{pp.label}}</span><span style="{{pp.subStyle}}">{{pp.sub}}</span></button>
            </sc-for>
          </div>
          <sc-if value="{{r.notSent}}" hint-placeholder-val="{{true}}">
            <button onClick="{{r.send}}" style="{{r.sendStyle}}">{{r.sendLabel}}</button>
          </sc-if>
          <sc-if value="{{r.sent}}" hint-placeholder-val="{{false}}">
            <div style="height: 48px; border-radius: 12px; background: #DDF0EC; color: #0F5F58; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Расчёт отправлен · ждём подтверждения</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isTeam}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px"><span style="font-size: 18px; font-weight: 700">Команда</span><span style="font-size: 13px; color: #4F5B56">{{teamSummary}}</span></div>
      <div style="flex-shrink: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
          <div style="border-bottom: 1px solid #EDF0EE">
            <button onClick="{{m.toggle}}" aria-expanded="{{m.open}}" style="width: 100%; min-height: 68px; padding: 12px 16px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; color: #17201C">
              <span style="{{m.avatarStyle}}">{{m.initials}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="{{m.nameStyle}}">{{m.name}}</span>
                <span style="font-size: 13px; color: #4F5B56">{{m.rolesText}}</span>
              </span>
              <span style="{{m.chipStyle}}">{{m.chip}}</span>
              <span style="color: #4F5B56">{{m.arrow}}</span>
            </button>
            <sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
              <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
                <div style="font-size: 14px; line-height: 1.4; color: #3F4A45">{{m.statusText}}</div>
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #F3F5F4">
                  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #4F5B56">Телефон · вход по коду из SMS</span><span style="font-size: 15px; font-weight: 600">{{m.phone}}</span></span>
                  <a href="{{m.tel}}" style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Позвонить</a>
                </div>
                <sc-if value="{{m.isInvited}}" hint-placeholder-val="{{false}}">
                  <div style="font-size: 14px; line-height: 1.4; padding: 10px 12px; border-radius: 12px; background: #EAF1F8; color: #1E4D7A">Ссылка для входа отправлена по SMS. Как только {{m.short}} войдёт, появится в выборе исполнителя в заявках.</div>
                  <button onClick="{{m.cancel}}" style="width: 100%; height: 44px; border-radius: 12px; border: 1px solid #D5DDD9; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer">Отменить приглашение</button>
                </sc-if>
                <sc-if value="{{m.isMember}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <span style="font-size: 13px; font-weight: 600; color: #4F5B56">{{m.rolesLabel}}</span>
                    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
                      <sc-for list="{{m.roleOpts}}" as="ro" hint-placeholder-count="3">
                        <button onClick="{{ro.pick}}" aria-pressed="{{ro.on}}" style="{{ro.style}}">{{ro.label}}</button>
                      </sc-for>
                    </div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <span style="font-size: 13px; font-weight: 600; color: #4F5B56">Рабочие дни</span>
                    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
                      <sc-for list="{{m.dayOpts}}" as="dy" hint-placeholder-count="7">
                        <button onClick="{{dy.pick}}" aria-pressed="{{dy.on}}" style="{{dy.style}}">{{dy.label}}</button>
                      </sc-for>
                    </div>
                  </div>
                  <div style="{{m.summaryStyle}}">{{m.summary}}</div>
                  <sc-if value="{{m.canDisable}}" hint-placeholder-val="{{true}}">
                    <button onClick="{{m.toggleAccess}}" style="{{m.accessStyle}}">{{m.accessLabel}}</button>
                    <span style="font-size: 12px; color: #4F5B56">Заказы, фото и переписка останутся в истории.</span>
                  </sc-if>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

        const st = s.settings;
        const SEC = { services: 'Услуги и цены', page: 'Страница компании', limits: 'Без меня исполнитель может', alerts: 'Уведомления' };
        const nTypes = Object.keys(s.types).filter((k) => s.types[k].on).length;
        const nExtras = s.extras.filter((e) => e.on).length;
        const nAlerts = Object.keys(s.alerts).filter((k) => s.alerts[k]).length;
        const limL = { '0': 'менять сумму нельзя', '5': 'менять сумму до 5%', '10': 'менять сумму до 10%', any: 'менять сумму без ограничений' }[s.limit];
        const MENU = [
          { id: 'services', label: 'Услуги и цены', sub: 'Типов уборки: ' + nTypes + ' · доп. услуг: ' + nExtras + ' · окна, выезд, минимум' },
          { id: 'page', label: 'Страница компании', sub: 'Ссылка для Авито и мессенджеров' },
          { id: 'limits', label: 'Что исполнитель может без меня', sub: 'Сейчас: ' + limL },
          { id: 'alerts', label: 'Уведомления', sub: 'Включено ' + nAlerts + ' из 4' }
        ];
        return {
          inSettings: !!st, notSettings: !st,
          isSetMenu: st === 'menu', isSetServices: st === 'services', isSetPage: st === 'page', isSetLimits: st === 'limits', isSetAlerts: st === 'alerts',
          settingsTitle: st === 'menu' ? 'Настройки' : SEC[st] || '',
          backLabel: st === 'menu' ? 'Назад' : 'Настройки',
          settingsBack: () => set({ settings: this.state.settings === 'menu' ? '' : 'menu' }),
          openSettings: () => set({ settings: this.state.settings ? '' : 'menu' }),
          gearStyle: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (st ? 'background: #0F766E; color: #FFFFFF; border: 1px solid #0F766E' : 'background: #FFFFFF; color: #17201C; border: 1px solid #D5DDD9'),
          setMenu: MENU.map((x) => ({ label: x.label, sub: x.sub, open: () => set({ settings: x.id }) })),
          isToday: !st && s.tab === 'today', isRequests: !st && s.tab === 'requests', isTeam: !st && s.tab === 'team', isResults: !st && s.tab === 'results'
        };
      })(),
      members, teamSummary,
      invName: s.invName, invPhone: s.invPhone,
      setInvName: (e) => set({ invName: e.target.value }), setInvPhone: (e) => set({ invPhone: e.target.value }),
      invRoles: ROLE_OPTS.map(([k, l]) => ({ label: l, on: !!s.invRoles[k], style: pill2(!!s.invRoles[k]), pick: () => set({ invRoles: { ...this.state.invRoles, [k]: !this.state.invRoles[k] } }) })),
      inviteBtnLabel: invOk ? 'Отправить приглашение' : 'Введите имя и телефон',
      inviteBtnStyle: 'width: 100%; height: 48px; margin-top: 4px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; ' + (invOk ? 'background: #0F766E; color: #FFFFFF' : 'background: #DCE3E0; color: #4F5B56'),
      sendInvite: () => {
        const st = this.state;
        const n = (st.invName || '').trim();
        if (!n || (st.invPhone || '').replace(/\D/g, '').length < 10) return;
        const id = 'inv' + st.team.length;
        set({ team: st.team.concat([{ id, name: n, short: n.split(' ')[0], initials: n.slice(0, 1).toUpperCase(), g: 'f', phone: st.invPhone, roles: { ...st.invRoles }, days: [true, true, true, true, true, false, false], base: 'free', statusText: '', invited: true, stats: { orders: 0, changes: 0, damage: 0 } }]), invName: '', invPhone: '', invRoles: { worker: true }, openMember: id });
      },
      attentionCount: attention ? attention + ' шт.' : '', allClear: attention === 0,
      dmgOpen, dmgNew: s.dmg === 'new', dmgContacted: s.dmg === 'contacted', dmgResolved: s.dmg === 'resolved',
      dmgStatusLabel: { new: 'Новое', contacted: 'Связался', resolved: 'Решено' }[s.dmg],
      dmgContact: () => set({ dmg: 'contacted' }),
      dmgOutcomes: [
        { label: 'Скидка в этом заказе', text: 'договорились о скидке в этом заказе.' },
        { label: 'Возместим стоимость плафона', text: 'договорились возместить стоимость плафона.' },
        { label: 'Клиентка претензий не имеет', text: 'клиентка претензий не имеет.' }
      ].map((o) => ({ label: o.label, pick: () => set({ dmg: 'resolved', dmgOutcome: o.text }) })),
      dmgOutcomeText: s.dmgOutcome,
      reqWaiting: waiting.length > 0,
      reqWaitingTitle: waiting.length === 1 ? 'Заявка ждёт расчёта · ' + waiting[0].client : waiting.length + ' заявки ждут расчёта',
      toRequests: () => set({ tab: 'requests' }),
      ...(() => {
        const CASH = [
          { id: 'andrey', name: 'Андрей', sum: 9900, sub: 'вчера · 2 заказа · не сдано 1 день' },
          { id: 'olga', name: 'Ольга', sum: 4800, sub: 'сегодня · ул. Мельникайте, 106' }
        ];
        const left = CASH.filter((c) => !s.settled[c.id]).reduce((a, c) => a + c.sum, 0);
        return {
          cashTotal: left ? fmt(left) + ' ₽' : 'всё сдано',
          cashRows: CASH.map((c) => { const done = !!s.settled[c.id];
            return { name: c.name, sumText: fmt(c.sum), open: !done, sub: done ? '✓ сдано вам сегодня' : c.sub,
              subStyle: 'font-size: 13px; color: ' + (done ? '#0F766E' : c.id === 'andrey' ? '#8A3A0B' : '#4F5B56'),
              settle: () => set({ settled: { ...this.state.settled, [c.id]: true } }) }; })
        };
      })(),
      rows, requests, svcTypes, svcExtras, svcMisc,
      newName: s.newName, setNewName: (e) => set({ newName: e.target.value }),
      addService: () => { const n = (this.state.newName || '').trim(); if (n) set({ extras: this.state.extras.concat([{ id: 'custom' + this.state.extras.length, label: n, price: 500, on: true }]), newName: '' }); },
      prices: [
        { label: 'Генеральная уборка', value: '170 ₽/м²' }, { label: 'Поддерживающая', value: '100 ₽/м²' }, { label: 'После ремонта', value: '200 ₽/м²' },
        { label: 'Окно стандартное', value: '600 ₽' }, { label: 'Окно панорамное', value: '1 500 ₽' }, { label: 'Духовка', value: '900 ₽' },
        { label: 'Холодильник', value: '900 ₽' }, { label: 'Балкон', value: '1 500 ₽' }, { label: 'Уборка за питомцем', value: '500 ₽' },
        { label: 'Выезд за город', value: '1 000 ₽' }, { label: 'Минимальный заказ', value: '3 000 ₽' }
      ],
      limits: LIMITS.map((l) => ({ label: l.label, on: s.limit === l.id, style: pill(s.limit === l.id), pick: () => set({ limit: l.id }) })),
      limitNote,
      alerts: ALERTS.map((a) => {
        const on = !!s.alerts[a.id];
        return { label: a.label, on,
          trackStyle: 'width: 48px; height: 28px; flex-shrink: 0; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; ' + (on ? 'background: #0F766E; justify-content: flex-end' : 'background: #C3CEC9; justify-content: flex-start'),
          knobStyle: 'width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; display: block',
          toggle: () => set({ alerts: { ...this.state.alerts, [a.id]: !this.state.alerts[a.id] } }) };
      }),
      staff: [
        { name: 'Ольга', orders: 16, changes: 4, remarks: 0, avg: 2100 },
        { name: 'Татьяна', orders: 13, changes: 1, remarks: 1, avg: 1700 },
        { name: 'Андрей', orders: 11, changes: 3, remarks: 0, avg: 2900 },
        { name: 'Сергей (я)', orders: 6, changes: 0, remarks: 0, avg: 0 }
      ].map((x) => {
        const often = x.changes / x.orders > 0.25;
        const times = (n) => (n % 10 === 1 && n % 100 !== 11 ? ' раз' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? ' раза' : ' раз');
        return { name: x.name, orders: x.orders, exact: x.orders - x.changes,
          changeText: x.changes ? x.changes + times(x.changes) + ' уточняли на месте · в среднем +' + fmt(x.avg) + ' ₽' + (often ? ' — часто' : '') : 'Ни разу не меняли цену на месте',
          changeStyle: 'font-size: 14px; line-height: 1.4; color: ' + (often ? '#8A3A0B; font-weight: 600' : '#3F4A45'),
          remarkText: x.remarks ? 'Замечаний от клиентов: ' + x.remarks : 'Замечаний от клиентов нет',
          remarkStyle: 'font-size: 13px; color: ' + (x.remarks ? '#8A3A0B' : '#4F5B56') };
      })
    };
  }
}

mountPrototype(Component, 'tpl', 'app');
</script>
</body>
